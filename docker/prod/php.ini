; Üretim PHP ayarları — Entegrasyon

memory_limit = 512M
max_execution_time = 120
; CSV içe aktarma dosyaları (webhook sınırı Caddy'de ayrıca 1 MB).
upload_max_filesize = 20M
post_max_size = 21M

; Hata ekrana BASILMAZ: yığın izi kimlik bilgisi ve yol sızdırır.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
expose_php = Off

date.timezone = Europe/Istanbul

; Kod imajın içinde ve değişmez: zaman damgası kontrolü kapalı.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
