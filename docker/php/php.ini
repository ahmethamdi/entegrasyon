; Geliştirme ortamı PHP ayarları — Entegrasyon

memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 20M
post_max_size = 20M

; Webhook gövde sınırı nginx tarafında da uygulanır (§11).
; Buradaki değer toplu içe aktarma dosyaları içindir.

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

date.timezone = Europe/Istanbul

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
