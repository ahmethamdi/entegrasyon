server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;
    charset utf-8;

    # Webhook gövde sınırı — Mimari Karar Dokümanı v2.2 · §11.
    client_max_body_size 1m;

    # ─────────────────────────────────────────────────────────────────
    # GÜVENLİK BAŞLIKLARI — §11
    # ─────────────────────────────────────────────────────────────────
    #
    # HSTS BURADA DEĞİL, ÜRETİM VHOST'UNDA. Bu dosya YEREL geliştirme
    # içindir ve :80 üzerinde düz HTTP dinler; HSTS göndermek tarayıcıya
    # "localhost'a bir daha ASLA HTTP ile bağlanma" dedirtir ve o kayıt
    # max-age boyunca kalıcıdır — geliştiricinin makinesindeki DİĞER
    # localhost projelerini de kırar. Geri alması zordur
    # (chrome://net-internals/#hsts).
    #
    # Üretimde (:443 TLS · §15) eklenecek satır:
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    # Prosedür `docs/GUVENLIK-KONTROL-LISTESI.md` içinde.
    #
    # Aşağıdakiler şemadan BAĞIMSIZDIR ve yerelde de güvenlidir:
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
