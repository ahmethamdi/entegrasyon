name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CODELOAD 429 — ÖNCEKİ ÇÖZÜM NEDEN YETMEDİ
#
# `composer.lock` paketleri `api.github.com/.../zipball` olarak işaretler ve
# Composer indirirken bunu `codeload.github.com`'a ÇEVİRİR. O yeniden yazımda
# Authorization başlığı DÜŞER: `github-oauth` token'ı Composer'ın API
# isteklerini kimliklendirir ama zip indirmesine hiç değmez. Yani token
# konulmuş olmasına rağmen indirmeler ANONİM gidiyordu ve paylaşımlı runner
# IP'sinin çok düşük limitine takılıyordu.
#
# Bu yüzden çözüm token değil KAYNAK DEĞİŞTİRMEKTİR: Packagist'in kendi
# dist aynası (`repo.packagist.org`) aynı zip'leri sunar, codeload'a hiç
# çıkılmaz ve GitHub'ın anonim limiti devre dışı kalır. Token yine de
# duruyor — Composer'ın metadata API çağrıları için faydası sürüyor.
env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  tests:
    name: Tests (PHP 8.3 · PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: entegrasyon_test
          POSTGRES_USER: entegrasyon
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U entegrasyon"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      # ACTION'IN KENDİSİ DE 429 YİYEBİLİR ve bu, kendi adımlarımızdaki
      # retry'ın ULAŞAMADIĞI yerdir: iş, ilk komutumuz çalışmadan düşer
      # (loglarda "Failed to download action ... after 3 attempts").
      #
      # `continue-on-error` ile ilk deneme düşse bile iş DEVAM eder ve
      # ikinci deneme çalışır. Runner action indirmesini kendi içinde de
      # üç kez dener; ikinci adım o üçlüyü ikiye katlar ve aradaki
      # gecikmede limit açılır. İkisi de düşerse iş HAKLI olarak kırmızı
      # olur — `id`/`outcome` ile bu açıkça kontrol edilir.
      - name: Setup PHP
        id: php
        continue-on-error: true
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, intl, bcmath, zip, pcntl, posix
          coverage: none

      - name: Setup PHP (retry)
        if: steps.php.outcome == 'failure'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, intl, bcmath, zip, pcntl, posix
          coverage: none

      # HEM vendor HEM composer'ın indirme önbelleği tutulur.
      #
      # Yalnızca vendor tutulsaydı kısmi isabet (restore-keys) durumunda
      # eksik paketler yine codeload'dan inerdi; indirme önbelleği o
      # boşluğu da kapatır ve ağa hiç çıkılmaz. 429 tam olarak burada
      # yaşandı: paylaşımlı runner IP'si limite takıldı ve iş düştü.
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            vendor
            ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # 429'UN SEBEBİ VE BU ADIMIN İKİ SAVUNMASI
      #
      # `composer.lock` paketleri `api.github.com/.../zipball` olarak
      # işaretler ve indirmeler `codeload.github.com`'a gider. Oradaki
      # ANONİM limit paylaşımlı runner IP'siyle dolar; limit bize ait
      # olmayan trafikle tükendiği için kodda hiçbir sorun yokken iş düşer.
      #
      # (1) KAYNAK YERİNE GİT: `--prefer-source` dist zip'i yerine git
      #     clone kullanır ve codeload'un zip uç noktasına HİÇ dokunmaz.
      #     Sadece yeniden denemede devreye girer; normal koşuda dist
      #     hızlıdır ve cache sayesinde çoğu zaman ağa bile çıkılmaz.
      #
      # (2) BEKLEME UZUN: 429 saniyelerle değil DAKİKALARLA açılır. Önceki
      #     tur 15/30/45 sn bekledi ve üçü de limit kapalıyken denendiği
      #     için üçü de düştü. 60/120 sn gerçek pencereye denk gelir.
      #
      # Hâlâ düşüyorsa sorun geçici değildir ve iş HAKLI olarak kırmızı
      # olur — sonsuz denemek arızayı gizlerdi.
      - name: Install dependencies
        run: |
          set -o pipefail

          composer install --prefer-dist --no-interaction --no-progress && exit 0

          echo "dist indirmesi düştü (codeload 429 olabilir); 60 sn sonra kaynak koddan denenecek…"
          sleep 60

          # Kaynak yolu zip uç noktasını kullanmaz: 429 tam oradadır.
          composer install --prefer-source --no-interaction --no-progress && exit 0

          echo "kaynak yolu da düştü; 120 sn sonra son deneme…"
          sleep 120

          composer install --prefer-source --no-interaction --no-progress

      # public/build .gitignore'dadır; checkout sonrası dizin YOKTUR.
      # Blade sayfası render eden testler (ExampleTest → GET /) Vite
      # manifest'ini okur ve manifest olmadan istisna fırlatır. Frontend
      # ayrı bir job'da build ediliyor ama onun çıktısı buraya taşınmaz —
      # job'lar ayrı runner'larda, ayrı dosya sisteminde çalışır.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: entegrasyon_test
          DB_USERNAME: entegrasyon
          DB_PASSWORD: secret
        run: php artisan migrate --force

      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
          REDIS_HOST: 127.0.0.1
        run: php artisan test

  lint:
    name: Code style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Tests job'ındaki ile aynı gerekçe: action'ın kendisi de 429 yiyebilir
      # ve bu, kendi retry'ımızın ulaşamadığı yerdir.
      - name: Setup PHP
        id: php
        continue-on-error: true
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Setup PHP (retry)
        if: steps.php.outcome == 'failure'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # Bu job'ın TÜM bağımlılıklara ihtiyacı yok — yalnızca Pint çalıştırır.
      # Tam `composer install` yüzlerce paketi codeload'dan indirir ve tam bu
      # yüzden 429 yiyip düşmüştü: Tests job'ının cache'i vardı ve geçiyordu,
      # cache'i olmayan lint düşüyordu. YALNIZCA Pint kurulur; rate limit
      # yüzeyi yüzlerce paketten bire iner.
      #
      # Sürüm composer.json'dan okunur ve orada sabitlenir — burada ikinci
      # bir sürüm yazmak iki dosyanın sessizce ayrışmasına yol açardı.
      - name: Cache Pint
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: pint-${{ hashFiles('composer.json') }}
          restore-keys: pint-

      # Tests job'ındaki ile aynı iki savunma: yeniden denemede kaynak
      # koddan kurulur (codeload'un zip uç noktası atlanır) ve bekleme
      # 429'un gerçek penceresine denk gelecek kadar uzundur.
      - name: Install Pint
        run: |
          PINT_VERSION=$(php -r 'echo json_decode(file_get_contents("composer.json"), true)["require-dev"]["laravel/pint"];')

          composer global require laravel/pint:"$PINT_VERSION" \
            --prefer-dist --no-interaction --no-progress && exit 0

          echo "dist indirmesi düştü (codeload 429 olabilir); 60 sn sonra kaynak koddan denenecek…"
          sleep 60

          composer global require laravel/pint:"$PINT_VERSION" \
            --prefer-source --no-interaction --no-progress && exit 0

          echo "kaynak yolu da düştü; 120 sn sonra son deneme…"
          sleep 120

          composer global require laravel/pint:"$PINT_VERSION" \
            --prefer-source --no-interaction --no-progress

      - name: Laravel Pint
        run: $(composer global config bin-dir --absolute --quiet)/pint --test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build
