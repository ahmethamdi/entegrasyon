name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Composer paketleri codeload.github.com'dan iner ve KİMLİKSİZ istekler çok
# düşük bir limite tabidir; runner IP'leri paylaşımlı olduğu için limit bize
# ait olmayan trafikle de dolar ve HTTP 429 ile iş düşer.
#
# GITHUB_TOKEN her koşuda ücretsiz mevcuttur ve isteği kimlikli hale getirir;
# limit birkaç kat yükselir. Bu bir "gizli anahtar" değil, koşuya özel
# kısa ömürlü bir token.
env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  tests:
    name: Tests (PHP 8.3 · PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: entegrasyon_test
          POSTGRES_USER: entegrasyon
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U entegrasyon"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, intl, bcmath, zip, pcntl, posix
          coverage: none

      # HEM vendor HEM composer'ın indirme önbelleği tutulur.
      #
      # Yalnızca vendor tutulsaydı kısmi isabet (restore-keys) durumunda
      # eksik paketler yine codeload'dan inerdi; indirme önbelleği o
      # boşluğu da kapatır ve ağa hiç çıkılmaz. 429 tam olarak burada
      # yaşandı: paylaşımlı runner IP'si limite takıldı ve iş düştü.
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            vendor
            ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # 429 GEÇİCİ bir hatadır: paylaşımlı runner IP'sinin limiti bizden
      # bağımsız trafikle dolar ve birkaç saniye sonra açılır. Tek denemede
      # düşmek, kodda hiçbir sorun yokken CI'ı kırmızı gösterir ve gerçek
      # kırmızıya olan güveni aşındırır.
      #
      # Üç deneme, artan bekleme. Hâlâ düşüyorsa sorun geçici değildir ve
      # iş HAKLI olarak kırmızı olur — sonsuz denemek arızayı gizlerdi.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            composer install --prefer-dist --no-interaction --no-progress && exit 0
            echo "composer install başarısız (deneme ${attempt}/3), bekleniyor…"
            sleep $((attempt * 15))
          done
          exit 1

      # public/build .gitignore'dadır; checkout sonrası dizin YOKTUR.
      # Blade sayfası render eden testler (ExampleTest → GET /) Vite
      # manifest'ini okur ve manifest olmadan istisna fırlatır. Frontend
      # ayrı bir job'da build ediliyor ama onun çıktısı buraya taşınmaz —
      # job'lar ayrı runner'larda, ayrı dosya sisteminde çalışır.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: entegrasyon_test
          DB_USERNAME: entegrasyon
          DB_PASSWORD: secret
        run: php artisan migrate --force

      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
          REDIS_HOST: 127.0.0.1
        run: php artisan test

  lint:
    name: Code style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # Bu job'ın TÜM bağımlılıklara ihtiyacı yok — yalnızca Pint çalıştırır.
      # Tam `composer install` yüzlerce paketi codeload'dan indirir ve tam bu
      # yüzden 429 yiyip düşmüştü: Tests job'ının cache'i vardı ve geçiyordu,
      # cache'i olmayan lint düşüyordu. YALNIZCA Pint kurulur; rate limit
      # yüzeyi yüzlerce paketten bire iner.
      #
      # Sürüm composer.json'dan okunur ve orada sabitlenir — burada ikinci
      # bir sürüm yazmak iki dosyanın sessizce ayrışmasına yol açardı.
      - name: Cache Pint
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: pint-${{ hashFiles('composer.json') }}
          restore-keys: pint-

      - name: Install Pint
        run: |
          PINT_VERSION=$(php -r 'echo json_decode(file_get_contents("composer.json"), true)["require-dev"]["laravel/pint"];')

          for attempt in 1 2 3; do
            composer global require laravel/pint:"$PINT_VERSION" \
              --no-interaction --no-progress && exit 0
            echo "pint kurulumu başarısız (deneme ${attempt}/3), bekleniyor…"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Laravel Pint
        run: $(composer global config bin-dir --absolute --quiet)/pint --test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build
